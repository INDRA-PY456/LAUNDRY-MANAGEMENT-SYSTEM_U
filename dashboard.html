<html>
<head>
    <title>Dashboard - Laundry Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <img src="C:\Users\USER1\OneDrive\Documents\COLLEGE\PROJECTS\LMS\images\logo3.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                LAUNDRY MANAGEMENT SYSTEM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">DASHBOARD</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="orders.html">ORDERS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="neworder.html">NEW ORDER</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">ACTIONS</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="customers.html">CUSTOMERS</a></li>
                            <li><a class="dropdown-item" href="customers.html">REPORTS</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="login.html" onclick="return logout(event)"><i class="bi bi-box-arrow-right"></i> LOGOUT</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>DASHBOARD</h2>
        <div class="row g-4 mt-1">
            <div class="col-md-3">
                <div class="card text-bg-light h-100">
                    <div class="card-header">Total Orders</div>
                    <div class="card-body">
                        <h3 class="card-title" id="totalOrders">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-light h-100">
                    <div class="card-header">Completed Orders</div>
                    <div class="card-body">
                        <h3 class="card-title" id="completedOrders">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-light h-100">
                    <div class="card-header">Pending Orders</div>
                    <div class="card-body">
                        <h3 class="card-title" id="pendingOrders">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-light h-100">
                    <div class="card-header">Total Revenue</div>
                    <div class="card-body">
                        <h3 class="card-title" id="totalRevenue">₹0</h3>
                    </div>
                </div>
            </div>
        </div>
        <h4 class="mt-5">RECENT ORDERS</h4>
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Order ID</th>
                        <th scope="col">Customer</th>
                        <th scope="col">Service</th>
                        <th scope="col">Status</th>
                        <th scope="col">Amount</th>
                    </tr>
                </thead>
                <tbody id="recentOrders"></tbody>
            </table>
        </div>
        <div class="d-flex justify-content-end mt-4 mb-4">
            <a href="neworder.html" class="btn btn-dark"><i class="bi bi-plus-lg"></i> NEW ORDER</a>
        </div>
    </div>
    <script>
        async function loadDashboard() {
            try {
                const response = await fetch("/api/dashboard");
                if (!response.ok) throw new Error("Failed to load dashboard");
                const data = await response.json();
                document.getElementById("totalOrders").innerText = data.totalOrders;
                document.getElementById("completedOrders").innerText = data.completedOrders;
                document.getElementById("pendingOrders").innerText = data.pendingOrders;
                document.getElementById("totalRevenue").innerText = "₹" + Number(data.totalRevenue).toLocaleString("en-IN");
                const tableBody = document.getElementById("recentOrders");
                tableBody.innerHTML = "";
                if (data.recentOrders.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="text-center">No orders found</td></tr>`;
                    return;
                }
                data.recentOrders.forEach(order => {
                    let badgeClass = "text-bg-warning";
                    if (order.status === "Completed") {
                        badgeClass = "text-bg-success";
                    } else if (order.status === "Ready") {
                        badgeClass = "text-bg-primary";
                    } else if (order.status === "Washing" || order.status === "Drying" || order.status === "Ironing") {
                        badgeClass = "text-bg-info";
                    }
                    tableBody.innerHTML += `
                        <tr>
                            <th scope="row">LM${String(order.id).padStart(2, "0")}</th>
                            <td>${order.customerName}</td>
                            <td>${order.service}</td>
                            <td><span class="badge ${badgeClass}">${order.status}</span></td>
                            <td>₹${Number(order.total).toLocaleString("en-IN")}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                document.getElementById("recentOrders").innerHTML = `<tr><td colspan="5" class="text-center text-danger">Unable to connect to backend</td></tr>`;
            }
        }

        function logout(event) {
            event.preventDefault();
            localStorage.removeItem("user");
            fetch("/api/logout", { method: "POST" }).finally(() => {
                window.location.href = "login.html";
            });
            return false;
        }

        loadDashboard();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
