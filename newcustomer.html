    <div class="container mt-4">
        <h2>NEW CUSTOMER</h2>
        <div class="card mt-4">
            <div class="card-header">Customer Information</div>
            <div class="card-body">
                <div class="mb-3 row">
                    <label for="customerId" class="col-sm-3 col-form-label">Customer ID</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="customerId" placeholder="Auto generated" disabled>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="customerName" class="col-sm-3 col-form-label">Name</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="customerName">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="customerPhone" class="col-sm-3 col-form-label">Phone Number</label>
                    <div class="col-sm-9">
                        <input type="tel" class="form-control" id="customerPhone">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="customerEmail" class="col-sm-3 col-form-label">Email</label>
                    <div class="col-sm-9">
                        <input type="email" class="form-control" id="customerEmail">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="customerAddress" class="col-sm-3 col-form-label">Address</label>
                    <div class="col-sm-9">
                        <textarea class="form-control" id="customerAddress" rows="3"></textarea>
                    </div>
                </div>
                <div id="message"></div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4 mb-4">
            <a href="customers.html" class="btn btn-secondary">CANCEL</a>
            <button type="button" class="btn btn-success" onclick="addCustomer()">ADD CUSTOMER</button>
        </div>
    </div>
    <script>
        async function addCustomer() {
            const name = document.getElementById("customerName").value.trim();
            const phone = document.getElementById("customerPhone").value.trim();
            const email = document.getElementById("customerEmail").value.trim();
            const address = document.getElementById("customerAddress").value.trim();
            const message = document.getElementById("message");

            if (!name || !phone) {
                message.innerHTML = `<div class="alert alert-danger mt-3">Name and phone number are required.</div>`;
                return;
            }

            try {
                const response = await fetch("/api/customers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name,
                        phone,
                        email,
                        address
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.innerHTML = `<div class="alert alert-danger mt-3">${data.message}</div>`;
                    return;
                }

                message.innerHTML = `<div class="alert alert-success mt-3">Customer added successfully.</div>`;

                setTimeout(() => {
                    window.location.href = "customers.html";
                }, 800);
            } catch (error) {
                message.innerHTML = `<div class="alert alert-danger mt-3">Unable to connect to backend.</div>`;
            }
        }

        function logout(event) {
            event.preventDefault();
            localStorage.removeItem("user");
            fetch("/api/logout", { method: "POST" }).finally(() => {
                window.location.href = "login.html";
            });
            return false;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
