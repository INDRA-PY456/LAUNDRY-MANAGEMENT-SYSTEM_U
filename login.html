<html>
<head>
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="C:\Users\USER1\OneDrive\Documents\COLLEGE\PROJECTS\LMS\images\logo3.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                LAUNDRY MANAGEMENT SYSTEM
            </a>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card" style="width: 30rem;">
            <div class="card-body">
                <h5 class="card-title text-center mb-4">LOGIN PAGE</h5>
                <form onsubmit="login(event)">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100" id="loginButton">Login</button>
                </form>
                <div id="message" class="mt-3 text-center"></div>
            </div>
        </div>
    </div>

    <script>
        async function login(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const button = document.getElementById("loginButton");
            const message = document.getElementById("message");

            button.disabled = true;
            button.innerText = "Logging in...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("user", JSON.stringify(data.user));
                    window.location.href = "dashboard.html";
                } else {
                    message.innerText = data.message;
                    message.className = "mt-3 text-center text-danger";
                }
            } catch (error) {
                message.innerText = "Unable to connect to the backend.";
                message.className = "mt-3 text-center text-danger";
            }

            button.disabled = false;
            button.innerText = "Login";
        }
    </script>
</body>
</html>
