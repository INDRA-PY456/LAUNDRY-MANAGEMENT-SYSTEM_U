</head>
<body>

                LAUNDRY MANAGEMENT SYSTEM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">

    <div class="container mt-4">
        <h2>ORDERS</h2>
        <div class="row align-items-center mt-4">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search orders">
                </div>
            </div>
            <div class="col-md-8 text-end">
                <a href="neworder.html" class="btn btn-dark">
                    <i class="bi bi-plus-lg"></i> NEW ORDER
                </a>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4 mb-4">
            <button type="button" class="btn btn-outline-secondary btn-sm filter-btn" data-filter="All">ALL</button>
            <button type="button" class="btn btn-outline-warning btn-sm filter-btn" data-filter="Pending">PENDING</button>
            <button type="button" class="btn btn-outline-info btn-sm filter-btn" data-filter="Ready">READY</button>
            <button type="button" class="btn btn-outline-primary btn-sm filter-btn" data-filter="Washing">WASHING</button>
            <button type="button" class="btn btn-outline-success btn-sm filter-btn" data-filter="Completed">COMPLETED</button>
        </div>
        <div id="message"></div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Order ID</th>
                        <th scope="col">Customer</th>
                        <th scope="col">Service</th>
                        <th scope="col">Status</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        const API_URL = "/api";
        let orders = [];
        let currentFilter = "All";

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/orders`);
                if (!response.ok) throw new Error("Failed to load orders");
                orders = await response.json();
                displayOrders();
            } catch (error) {
                document.getElementById("ordersTable").innerHTML = `<tr><td colspan="6" class="text-center text-danger">Unable to connect to backend</td></tr>`;
            }
        }

        function displayOrders() {
            const search = document.getElementById("searchInput").value.toLowerCase().trim();
            const table = document.getElementById("ordersTable");

            const filteredOrders = orders.filter(order => {
                const matchesFilter = currentFilter === "All" || order.status === currentFilter || (currentFilter === "Pending" && order.status !== "Completed" && order.status !== "Ready" && order.status !== "Washing");
                const matchesSearch = String(order.id).includes(search) || `LM${String(order.id).padStart(2, "0")}`.toLowerCase().includes(search) || order.customerName.toLowerCase().includes(search) || order.service.toLowerCase().includes(search);
                return matchesFilter && matchesSearch;
            });

            if (filteredOrders.length === 0) {
                table.innerHTML = `<tr><td colspan="6" class="text-center">No orders found</td></tr>`;
                return;
            }

            table.innerHTML = filteredOrders.map(order => {
                let badgeClass = "text-bg-warning";

                if (order.status === "Completed") {
                    badgeClass = "text-bg-success";
                } else if (order.status === "Ready") {
                    badgeClass = "text-bg-info";
                } else if (order.status === "Washing" || order.status === "Drying" || order.status === "Ironing") {
                    badgeClass = "text-bg-primary";
                }

                return `
                    <tr>
                        <th scope="row">LM${String(order.id).padStart(2, "0")}</th>
                        <td>${order.customerName}</td>
                        <td>${order.service}</td>
                        <td><span class="badge ${badgeClass}">${order.status}</span></td>
                        <td>₹${Number(order.total).toLocaleString("en-IN")}</td>
                        <td><a href="orderdetails.html?id=${order.id}" class="btn btn-primary btn-sm">View</a></td>
                    </tr>
                `;
            }).join("");
        }

        document.getElementById("searchInput").addEventListener("input", displayOrders);

        document.querySelectorAll(".filter-btn").forEach(button => {
            button.addEventListener("click", () => {
                currentFilter = button.dataset.filter;
                displayOrders();
            });
        });

        function logout(event) {
            event.preventDefault();
            localStorage.removeItem("user");
            fetch("/api/logout", { method: "POST" }).finally(() => {
                window.location.href = "login.html";
            });
            return false;
        }

        loadOrders();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
