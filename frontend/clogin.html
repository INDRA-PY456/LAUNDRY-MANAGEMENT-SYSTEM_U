<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Laundry Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="clogin.html">
                <img src="logo.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                LAUNDRY MANAGEMENT SYSTEM
            </a>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center" style="min-height:calc(100vh - 56px);">
        <div class="card" style="width:30rem;">
            <div class="card-body">
                <h5 class="card-title text-center mb-4">CUSTOMER LOGIN</h5>
                <form action="cdashboard.html">
                    <div class="mb-3">
                        <label for="customer" class="form-label">Customer ID / Phone Number</label>
                        <input type="text" class="form-control" id="customer" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">View My Order</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
